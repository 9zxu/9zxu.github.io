<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}">
<head>
  {{ partial "head.html" . }}
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
  <div class="topbar">
    {{ partial "header.html" . }}
  </div>
  {{ $hasSidebar := eq .Kind "page" }}
  <div class="shell{{ if not $hasSidebar }} shell--no-sidebar{{ end }}" data-sidebar-open="false">
    {{ if $hasSidebar }}
      <aside class="sidebar" id="sidebar">
        {{ partial "sidebar.html" . }}
      </aside>
    {{ end }}
    <div class="content-column">
      <div class="content-column__inner">
        <main>
          {{ block "main" . }}{{ end }}
        </main>
      </div>
    </div>
  </div>
  <footer class="site-footer">
    {{ partial "footer.html" . }}
  </footer>
  {{ partial "head/js.html" . }}
  {{- if .Params.math }}
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
      integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
      integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"
      onload="renderMathInElement(document.body, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '\\[', right: '\\]', display: true},
          {left: '$', right: '$', display: false},
          {left: '\\(', right: '\\)', display: false}
        ]
      });"></script>
  {{- end }}
</body>
</html>
